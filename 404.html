<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Page introuvable — mise.</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#E9DFCC" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1614" />
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
<style>
  :root{
    color-scheme:light;
    --paper:#E9DFCC; --surface:#FBF7F0; --ink:#241D18; --muted:#6B5F53;
    --accent:#C75B7C; --line:#DCCFBB;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      --paper:#1C1614; --surface:#271F1C; --ink:#F0E6E0; --muted:#A99B93;
      --accent:#DD7397; --line:#3A2E29;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    line-height:1.5;
  }
  .box{max-width:420px; width:100%; text-align:center}
  .logo{
    font-size:38px; font-weight:700; letter-spacing:-.03em; margin-bottom:28px;
  }
  .logo i{font-style:normal; color:var(--accent)}
  h1{font-size:21px; font-weight:600; letter-spacing:-.01em; margin-bottom:10px}
  p{font-size:15px; color:var(--muted); margin-bottom:26px}
  a{
    display:inline-block; font-size:16px; font-weight:600; text-decoration:none;
    padding:15px 28px; border-radius:14px; background:var(--accent); color:#fff;
    box-shadow:0 6px 18px rgba(0,0,0,.14);
  }
  a:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
</style>
</head>
<body>
  <main class="box">
    <div class="logo">mise<i>.</i></div>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être incomplet, ou la recette a été supprimée.</p>
    <a href="/">Revenir à l'accueil</a>
  </main>
</body>
</html>
